    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does PestLook work on a Mac or iPhone?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes — the full PestLook web application works on any Mac in any browser (Chrome, Safari, Firefox, Edge). There is currently no native iOS mobile app; the offline-first mobile app is Android only. iPad users can access the web dashboard through Safari, but for in-field offline logging and barcode scanning you'll need an Android device."
              }
            },
            {
              "@type": "Question",
              "name": "What happens when the beta ends? Will it cost money?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We haven't locked in post-beta pricing yet. What we can promise: every current user will receive advance notice before any paid tier is introduced, and we won't flip a switch on you without warning. The goal is to keep a meaningful free tier permanently — the platform is designed to be accessible to individual farmers, not just large agri-businesses."
              }
            },
            {
              "@type": "Question",
              "name": "How does offline sync actually work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "When you open the Android app with a connection, it pulls down your farms, fields, pest library, trap locations, and any assigned scouting sessions and caches them locally on the device. From that point you can work entirely offline — log pest counts, scan trap barcodes, attach photos, and record GPS coordinates. The moment the device detects connectivity again, everything queued locally is pushed to the server automatically in the background."
              }
            },
            {
              "@type": "Question",
              "name": "Is my farm data private? Who can see it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Each organisation is fully isolated — your farms, observations, photos, and reports are never visible to other tenants. We do not sell or share your data with third parties. Scouts within your organisation can only access what their role permits; admins control all permissions."
              }
            },
            {
              "@type": "Question",
              "name": "Can I have multiple scouts or users on one account?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Admins can add as many scouts as needed to their organisation, assign them to scouting sessions, and manage their roles from the web dashboard. There is no per-seat charge — unlimited team members are included on every plan."
              }
            },
            {
              "@type": "Question",
              "name": "What crops and pests does it support?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PestLook is entirely crop-agnostic. You define your own pest library (species, life stages, economic thresholds), your own trap types, and your own field names. It works for row crops, orchards, vegetables, viticulture, and anything else — for any pest, in any region of the world."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need a smartphone in the field?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "For the best in-field experience, yes — the Android app is built for field work: offline logging, barcode/QR trap scanning, GPS tagging, and photo capture. If you only need the web dashboard (reports, session planning, analytics), any device with a browser works fine, including tablets and laptops."
              }
            }
          ]
        }
    </script>
